services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: web-app-backend-dev
    ports:
      - "81:81"
    environment:
      - DB_PATH=/app/data/saved_recipes.db
    volumes:
      - ./backend:/app
      - recipe-db-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-frontend
      dockerfile: Dockerfile.dev
    image: web-app-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/react-frontend:/app
      - /app/node_modules
    stdin_open: true
    restart: unless-stopped

volumes:
  recipe-db-data:
    driver: local
