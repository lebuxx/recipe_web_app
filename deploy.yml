services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: web-app-backend
    ports:
      - "81:81"
    environment:
      - DB_PATH=/app/data/saved_recipes.db
    volumes:
      - recipe-db-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-frontend
      dockerfile: Dockerfile
    image: web-app-frontend

    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  recipe-db-data:
    driver: local
