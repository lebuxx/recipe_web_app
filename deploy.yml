services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: web-app-backend
    ports:
      - "81:81"
    env_file:
      # fehlt die .env, startet der Container trotzdem und die
      # Rezept-Endpunkte melden den fehlenden Key sauber an die UI zurück
      - path: ./backend/.env
        required: false
    environment:
      - DB_PATH=/app/data/saved_recipes.db
    volumes:
      - recipe-db-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-frontend
      dockerfile: Dockerfile
    image: web-app-frontend

    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  recipe-db-data:
    driver: local
