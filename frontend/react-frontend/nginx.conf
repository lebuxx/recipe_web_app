server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward all unknown paths to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for a long time (filenames contain a hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
