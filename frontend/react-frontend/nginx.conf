server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Alle unbekannten Pfade an die SPA übergeben
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets lange cachen (Dateinamen enthalten einen Hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
